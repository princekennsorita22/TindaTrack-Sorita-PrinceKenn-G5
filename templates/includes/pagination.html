{% if page_obj.paginator.num_pages > 1 %}
<nav class="pager" aria-label="Pages">
  {% if page_obj.has_previous %}<a class="btn btn-quiet" href="?{% if page_query %}{{ page_query }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">Previous</a>{% else %}<span></span>{% endif %}
  <span class="muted">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }} · {{ page_obj.paginator.count }} total</span>
  {% if page_obj.has_next %}<a class="btn btn-quiet" href="?{% if page_query %}{{ page_query }}&amp;{% endif %}page={{ page_obj.next_page_number }}">Next</a>{% else %}<span></span>{% endif %}
</nav>
{% endif %}
